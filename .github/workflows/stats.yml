name: Refresh profile stats

on:
  schedule:
    - cron: "30 0 * * *" # every day, 06:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/stats.py --test && python3 scripts/stats.py
        env:
          GH_TOKEN: ${{ github.token }}
          # Optional: a token with read access to your private repos, so the languages card refreshes too.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
      - name: Commit the new cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "Refresh profile stats" && git push)
